name: 🐞 Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: input
    id: pagina
    attributes: { label: Página, placeholder: "https://bacentools.web.app/bancos/" }
    validations: { required: true }
  - type: textarea
    id: passos
    attributes: { label: Passos para reproduzir, placeholder: "1. Busquei por ...\n2. Cliquei em ..." }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: O que você esperava e o que aconteceu }
    validations: { required: true }
  - type: input
    id: ambiente
    attributes: { label: Navegador e aparelho, placeholder: "Chrome 140, Android" }
